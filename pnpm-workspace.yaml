packages:
  - docs

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

# First-party packages are consumed as soon as they publish; browserslist's data packages republish
# daily, so a fresh lockfile always pins a version younger than the release-age gate.
minimumReleaseAgeExclude:
  - '@esportsplus/*'
  - baseline-browser-mapping
  - caniuse-lite
  - electron-to-chromium
