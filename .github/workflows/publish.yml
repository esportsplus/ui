name: publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_run:
    workflows: [bump version]
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    secrets:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    uses: esportsplus/typescript/.github/workflows/publish.yml@main
